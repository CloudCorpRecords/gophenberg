version: "2"

linters:
  default: standard
  enable:
    - cyclop
    - depguard
    - gocognit
    - lll
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 15
    lll:
      line-length: 120
    revive:
      rules:
        - name: blank-imports
          disabled: true
        - name: exported
    depguard:
      rules:
        sdk-purity:
          list-mode: strict
          files:
            - "**/sdk/*.go"
          allow:
            - $gostd
        content-steps-engine-free:
          list-mode: lax
          files:
            - "**/internal/content/typestore/*.go"
          deny:
            - pkg: github.com/jackc/pgx/v5
              desc: the store steps reach a database only through the backend
            - pkg: modernc.org/sqlite
              desc: the store steps reach a database only through the backend
            - pkg: github.com/gopherium/gophenberg/internal/postgres
              desc: the store steps reach a database only through the backend
            - pkg: github.com/gopherium/gophenberg/internal/sqlite
              desc: the store steps reach a database only through the backend
            - pkg: github.com/gopherium/framework/dbkit/postgres
              desc: the store steps reach a database only through the backend
            - pkg: github.com/gopherium/framework/dbkit/sqlite
              desc: the store steps reach a database only through the backend
        plugins-import-only-the-sdk:
          list-mode: lax
          files:
            - "**/plugins/**/*.go"
            - "!$test"
          deny:
            - pkg: github.com/gopherium/gophenberg/internal
              desc: plugins may import only the sdk package from Gophenberg
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - gocognit
      - path: internal/content/contenttest/
        linters:
          - cyclop
          - gocognit

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gopherium/gophenberg
