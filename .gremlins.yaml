unleash:
  workers: 3
  output-statuses: lct
  exclude-files:
    - '(^|/)db/(db|models|[a-z]+\.sql)\.go$'
    - '(^|/)testdb\.go$'
    - '(^|/)internal/content/contenttest/'
    - '(^|/)internal/media/mediatest/'
    - '(^|/)cmd/'
    - '^plugins/'
mutants:
  invert-logical:
    enabled: true
  invert-loopctrl:
    enabled: true
