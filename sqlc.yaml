version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/postgres/queries"
    schema:
      - "internal/postgres/schema"
      - "internal/postgres/migrations"
    gen:
      go:
        package: "db"
        out: "internal/postgres/db"
        sql_package: "pgx/v5"
        rename:
          core_medium: "CoreMedia"
        overrides:
          - column: "core.media.sizes"
            go_type:
              import: "github.com/gopherium/gophenberg/internal/media"
              type: "Sizes"
          - column: "core.content.fields"
            go_type:
              import: "github.com/gopherium/gophenberg/internal/content"
              type: "Values"
          - column: "core.content_revisions.fields"
            go_type:
              import: "github.com/gopherium/gophenberg/internal/content"
              type: "Values"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
  - engine: "sqlite"
    queries: "internal/sqlite/queries"
    schema:
      - "internal/sqlite/schema"
      - "internal/sqlite/migrations"
    gen:
      go:
        package: "db"
        out: "internal/sqlite/db"
        emit_exported_queries: true
        emit_pointers_for_null_types: true
        rename:
          core_medium: "CoreMedia"
        overrides:
          - column: "core_media.author_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "core_user_settings.user_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "auth_users.id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "core_media.created_at"
            go_type:
              import: "github.com/gopherium/framework/dbkit"
              type: "Time"
          - column: "core_media.updated_at"
            go_type:
              import: "github.com/gopherium/framework/dbkit"
              type: "Time"
          - column: "core_media.sizes"
            go_type:
              import: "github.com/gopherium/gophenberg/internal/sqlite/columns"
              type: "Sizes"
